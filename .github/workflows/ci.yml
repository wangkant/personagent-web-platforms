name: CI

# The offline regression suite: no API keys or network, the tests stub the model and transport.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A browser test that skips fails instead: every runner below has a browser for the walks' tests.
env:
  MIBO_REQUIRE_BROWSER: "1"

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # macOS and arm64 Linux run the same suite on one Python each.
        include:
          - os: macos-15
            python-version: "3.12"
          - os: ubuntu-24.04-arm
            python-version: "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # pytest and ruff come from the dev extra, where their versions are written once.
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      # The arm64 image has no Chrome, so the walks' tests use Playwright's Chromium there. Its sandbox needs the
      # user namespaces Ubuntu 24.04's AppArmor holds back from programs without a profile of their own.
      - name: A browser for the walks' tests (arm64 Linux)
        if: matrix.os == 'ubuntu-24.04-arm'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          python -m playwright install --with-deps chromium
          python -c "from playwright.sync_api import sync_playwright as p; pw = p().start(); print('PERSONA_BROWSER_PATH=' + pw.chromium.executable_path); pw.stop()" >> "$GITHUB_ENV"
      # Dead and undefined names only, not a style gate; re-exports carry `# noqa: F401`.
      - name: Lint for dead and undefined names
        run: ruff check . --select F401,F811,F821,F841
      - name: Run the test suite
        run: |
          python -m pytest -q --durations=25
          python -m compileall -q .

  windows:
    # Windows is the main deployment platform and the only one running storage.FileLock's msvcrt branch.
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run the test suite
        # bash: PowerShell reports only the last command of a step, which hid failing tests here.
        shell: bash
        run: |
          python -m pytest -q --durations=25
          python -m compileall -q .

  package:
    # A checkout hides packaging breakage, so the built artifacts are installed and run elsewhere.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build the sdist and the wheel, then check their metadata
        run: |
          python -m pip install "build>=1.2,<2" "twine>=6,<8"
          python -m build
          python -m twine check --strict dist/*
      - name: Check the wheel ships every tracked shared file
        # hatchling skips what .gitignore names, even when it is tracked.
        run: |
          python - <<'EOF'
          import glob, subprocess, zipfile
          prefix = "mibo/_bundled/"
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          shipped = {n[len(prefix):] for n in names if n.startswith(prefix)}
          tracked = set(subprocess.run(
              ["git", "ls-files", "data"],
              capture_output=True, text=True, check=True).stdout.split())
          assert tracked and tracked <= shipped, sorted(tracked - shipped)
          print(len(tracked), "tracked shared files are in the wheel")
          EOF
      - name: Editable install
        run: |
          python -m pip install -e .
          python -c "import mibo; print('editable', mibo.__version__)"
      - name: Install the wheel into a clean venv and import it from outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/wheelenv"
          if [ "$RUNNER_OS" = Windows ]; then BIN="$RUNNER_TEMP/wheelenv/Scripts"; else BIN="$RUNNER_TEMP/wheelenv/bin"; fi
          echo "WHEEL_BIN=$BIN" >> "$GITHUB_ENV"
          "$BIN/python" -m pip install --quiet dist/*.whl
          cd "$RUNNER_TEMP"
          "$BIN/python" -c "
          import importlib.metadata as md
          import mibo
          from mibo import home
          from mibo.agent import Agent
          assert mibo.__version__ == md.version('mibo'), mibo.__version__
          assert not home.is_checkout(), home.CHECKOUT
          assert home.resource('data', 'persona.example.en.txt').is_file(), 'data/persona.example.en.txt'
          assert (home.PACKAGE_DIR / 'py.typed').is_file(), 'py.typed missing from the wheel'
          print('wheel import ok', mibo.__version__)
          "
      - name: Smoke-test the installed command offline (version, run)
        run: |
          VERSION=$(python -c "import mibo; print(mibo.__version__)")
          python tools/package_smoke.py --mibo "$WHEEL_BIN/mibo" --version "$VERSION"
          python tools/welcome_smoke.py --mibo "$WHEEL_BIN/mibo"
      - name: Install the sdist into a clean venv and import it from outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/sdistenv"
          if [ "$RUNNER_OS" = Windows ]; then BIN="$RUNNER_TEMP/sdistenv/Scripts"; else BIN="$RUNNER_TEMP/sdistenv/bin"; fi
          "$BIN/python" -m pip install --quiet dist/*.tar.gz
          cd "$RUNNER_TEMP"
          "$BIN/python" -c "
          from mibo import home
          assert home.resource('data', 'persona.example.en.txt').is_file()
          print('sdist install ok')
          "
