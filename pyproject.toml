[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mibo"
version = "0.1.0"
description = "A companion on your desktop: one character that talks with you, remembers you, brings you one thing worth your time, and acts for you on the web, in programs and in files, behind cards you approve."
readme = "README.md"
requires-python = ">=3.10"
# Code taken from MIT and BSD projects keeps their licence (NOTICE), and the three
# character portraits are CC BY-NC-SA 4.0 (no commercial use).
license = "Apache-2.0 AND MIT AND BSD-2-Clause AND CC-BY-NC-SA-4.0"
license-files = ["LICENSE", "NOTICE", "mibo/static/characters/LICENSE.md", "mibo/static/welcome/markdown-it.LICENSE.txt"]
authors = [{ name = "Qiankang Wang" }]
keywords = [
    "llm", "agent", "desktop", "companion", "persona", "memory", "recommender",
    "browser-automation", "computer-use", "mcp", "skills",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.128,<1",
    # A floor here keeps the resolver off the pydantic 1.x line.
    "pydantic>=2.9,<3",
    "uvicorn>=0.34,<1",
    # The local connection the Electron shell makes to the app (host/launch.py).
    "websockets>=13,<18",
    "python-dotenv>=1.0,<2",
    "httpx>=0.27,<1",
    # Direct, not transitive: ingestion.py's SSRF guard imports httpcore._backends.auto.
    "httpcore>=1.0,<2",
    # Decodes the first frame of a GIF for vision endpoints that reject GIFs.
    "Pillow>=10.4,<14",
    # The no-key web search backend (DuckDuckGo).
    "ddgs>=9,<10",
    # Direct, not transitive: search.py gives ddgs's primp client the system's DNS resolver (dns_resolver, primp 2).
    "primp>=2,<3",
    # Reads robots.txt as Scrapy does, wildcards and a group for Mibo before the one for all (web/sites.py).
    "protego>=0.7,<1",
    # Reads RSS and Atom feeds, broken markup, odd dates and declared encodings included (sources/base.py).
    "feedparser>=6.0.14,<7",
    # A fetched page's main text, tables kept and menus left out, as trafilatura extracts it (web/fetch.py);
    # w3lib decodes the page in the charset its header, then its meta, names, as Scrapy does.
    "trafilatura>=2.3.1,<3",
    "w3lib>=2.5,<3",
    # Direct, not transitive: trafilatura's justext needs lxml's cleaner, which older pips miss as lxml[html_clean].
    "lxml_html_clean>=0.4,<1",
    # Reads the YAML front matter of a skill's SKILL.md, as other agents' hosts do (skills/store.py).
    "pyyaml>=6,<7",
    # The person's MCP servers, through the official SDK (mcp_client.py); jsonschema checks a call's
    # arguments against the tool's schema before the card (mcp_tools.py).
    "mcp>=2.3,<3",
    "jsonschema>=4.20,<5",
    # Keeps MCP servers' values and sign-in tokens in the system's credential store (secretstore.py).
    "keyring>=25,<26",
    # Scheduled tasks (schedule.py): dateutil's rrule finds the next time of a rhythm; tzlocal names this
    # computer's zone; tzdata is the zone database Windows lacks, for zoneinfo and daylight saving.
    "python-dateutil>=2.9,<3",
    "tzlocal>=5.3,<6",
    "tzdata>=2025.2",
    # Reads a bash command before it runs (shell/bashread.py): tree-sitter and its bash grammar.
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-bash>=0.25,<0.26",
    # Opens the local page in a window of its own. Windows has WebView2 for it;
    # elsewhere it needs a system toolkit, so it is the `app` extra there.
    "pywebview>=6,<7; sys_platform == 'win32'",
]

[project.optional-dependencies]
# The window of its own on macOS and Linux; without it the page opens in the browser.
# pywebview alone brings no toolkit on Linux, so Qt comes with it there.
app = ["pywebview>=6,<7; sys_platform != 'linux'", "pywebview[qt]>=6,<7; sys_platform == 'linux'"]
# Walks on the web: drives the Edge, Chrome or Chromium already installed, so
# no browser is downloaded.
web = ["playwright>=1.49,<2"]
# What CI installs on top of the runtime dependencies.
dev = ["pytest>=8,<10", "ruff>=0.6,<1", "playwright>=1.49,<2"]

[project.scripts]
mibo = "mibo.cli:main"

[project.urls]
Homepage = "https://github.com/wangkant/mibo"
Issues = "https://github.com/wangkant/mibo/issues"
Changelog = "https://github.com/wangkant/mibo/blob/main/CHANGELOG.md"
Documentation = "https://github.com/wangkant/mibo#readme"

# The checkout's shared files ship inside the package as mibo/_bundled,
# where home.resource() finds them in an installed copy.
[tool.hatch.build.targets.sdist]
# The version PyPI took for 1.2.1; hatchling defaults to a newer one.
core-metadata-version = "2.4"
only-include = ["mibo", "data", ".env.example"]

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
only-include = ["mibo", "data"]
# README illustrations: linked from published READMEs, read by nothing installed.
exclude = ["mibo/static/*.webp"]
# An editable install imports the checkout itself, which reads these files in place.
dev-mode-dirs = ["."]

[tool.hatch.build.targets.wheel.sources]
"data" = "mibo/_bundled/data"

[tool.hatch.build.targets.wheel.force-include]
".env.example" = "mibo/_bundled/.env.example"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The suites import the checkout, the tools under tools/, and tests/harness.
pythonpath = [".", "tools", "tests"]
# Test files are imported by path, so two folders may each hold a test_x.py.
addopts = "-m 'not window' --strict-markers --import-mode=importlib"
markers = [
    "browser: drives a headless Chromium-family browser through Playwright; with MIBO_REQUIRE_BROWSER=1 a skip fails",
    "window: needs a real display, pointer or keys; runs only with CI=true and MIBO_SANDBOX=1",
    "slow: takes over 2 s; the hygiene test caps how many",
    "floor: holds a safety floor (tests/floors/ and the tests floors/manifest.json names)",
]
