  <body class="starting">
    <div class="topline" aria-hidden="true"></div>
    <header class="titlebar" id="titlebar">
      <div class="titlebar-page" id="page-title"></div>
      <div class="pet-zone" aria-hidden="true"></div>
      <div class="window-controls" id="window-controls" hidden>
        <button type="button" id="window-minimize" tabindex="-1">
          <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0 5.5h10" /></svg></button
        ><button type="button" id="window-maximize" tabindex="-1">
          <svg class="when-normal" viewBox="0 0 10 10" aria-hidden="true"><rect x="0.5" y="0.5" width="9" height="9" rx="1" /></svg
          ><svg class="when-maximized" viewBox="0 0 10 10" aria-hidden="true"><rect x="0.5" y="2.5" width="7" height="7" rx="1" /><path d="M2.5 2.5v-1a1 1 0 0 1 1-1h5a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1h-1" /></svg></button
        ><button type="button" id="window-close" tabindex="-1">
          <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0.5 0.5l9 9M9.5 0.5l-9 9" /></svg>
        </button>
      </div>
    </header>
    <section id="onboard-view" class="onboard-view" hidden></section>
    <div class="frame" id="frame">
      <nav class="side" id="side">
        <div class="side-top">
          <button type="button" class="side-icon" id="side-toggle" aria-controls="side">
            <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3" /><path d="M9 3v18" /></svg>
          </button>
        </div>
        <button type="button" class="who" id="side-main">
          <span class="who-avatar" id="side-avatar"><span class="who-live" id="side-live" data-state="off"></span></span>
          <span class="who-text">
            <span class="who-name" id="side-main-name"></span>
            <span class="who-sub" id="side-main-sub"></span>
          </span>
          <span class="who-count" id="side-count" hidden></span>
        </button>
        <button type="button" class="side-item side-new" id="side-new">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" /><path d="M18.4 2.6a1.9 1.9 0 0 1 3 3l-9 9a2 2 0 0 1-.85.5l-2.87.84a.5.5 0 0 1-.62-.62l.84-2.87a2 2 0 0 1 .5-.85z" /></svg>
          <span data-t="newChat"></span><span class="kbd">Ctrl N</span>
        </button>
        <button type="button" class="side-item" id="side-finds">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8" /><path d="M3 3.5V8h4.5M12 7.5V12l3 2" /></svg>
          <span data-t="finds"></span>
        </button>
        <div class="side-chats" id="side-chats"></div>
        <div class="side-spacer"></div>
        <div class="side-foot">
          <button type="button" class="side-item" id="side-settings">
            <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" /><circle cx="12" cy="12" r="3" /></svg>
            <span data-t="settings"></span>
          </button>
        </div>
      </nav>
      <div class="side-scrim" id="side-scrim"></div>
      <main class="stage">
        <section id="chat-view" class="page" hidden></section>
        <section id="setup-view" class="page" hidden></section>
      </main>
    </div>
    <div class="side-menu" id="side-menu" role="menu" hidden>
      <button type="button" class="side-menu-item" role="menuitem" id="side-rename">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.17 6.81a1 1 0 0 0-3.98-3.98L3.84 16.17a2 2 0 0 0-.5.83l-1.32 4.35a.5.5 0 0 0 .62.62l4.35-1.32a2 2 0 0 0 .83-.5z" /></svg>
        <span data-t="rename"></span>
      </button>
      <button type="button" class="side-menu-item side-menu-danger" role="menuitem" id="side-delete">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18" /><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" /><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" /></svg>
        <span></span>
      </button>
